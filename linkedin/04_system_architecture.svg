<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="archShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1100" height="520" rx="16" fill="url(#archBg)" stroke="#1f2937" stroke-width="2"/>

  <!-- Title -->
  <text x="550" y="45" font-family="sans-serif" font-size="20" fill="#f8fafc" font-weight="bold" text-anchor="middle">Local-First Privacy Architecture &amp; System Flow</text>
  <text x="550" y="68" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">All customer records, secrets, and WhatsApp session state remain 100% on your local machine.</text>

  <!-- Local Machine Security Boundary Box -->
  <rect x="40" y="90" width="670" height="395" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="60" y="80" width="220" height="22" rx="4" fill="#064e3b"/>
  <text x="170" y="95" font-family="sans-serif" font-size="11" fill="#34d399" font-weight="bold" text-anchor="middle">🔒 LOCAL HOST BOUNDARY (127.0.0.1)</text>

  <!-- Node 1: React Vite Dashboard -->
  <g filter="url(#archShadow)">
    <rect x="70" y="130" width="260" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
    <rect x="70" y="130" width="260" height="32" rx="10" fill="#2563eb"/>
    <text x="200" y="152" font-family="sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">Frontend Dashboard</text>
    <text x="90" y="182" font-family="sans-serif" font-size="12" fill="#cbd5e1">• React 18 + Vite (SPA)</text>
    <text x="90" y="202" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Tailwind CSS + Recharts</text>
    <text x="90" y="222" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Lucide Icons + Real-time UI</text>
    <text x="90" y="252" font-family="monospace" font-size="11" fill="#60a5fa">http://localhost:5180</text>
  </g>

  <!-- Arrow between Frontend and Backend -->
  <path d="M 200 280 L 200 320" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
  <text x="215" y="305" font-family="sans-serif" font-size="10" fill="#38bdf8" font-weight="600">REST API / JSON</text>

  <!-- Node 2: FastAPI Backend Engine -->
  <g filter="url(#archShadow)">
    <rect x="70" y="320" width="260" height="145" rx="10" fill="#1e293b" stroke="#334155"/>
    <rect x="70" y="320" width="260" height="32" rx="10" fill="#047857"/>
    <text x="200" y="342" font-family="sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">Backend API &amp; Rules Engine</text>
    <text x="90" y="372" font-family="sans-serif" font-size="12" fill="#cbd5e1">• FastAPI + Pydantic v2</text>
    <text x="90" y="392" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Deterministic Rules (Zero AI)</text>
    <text x="90" y="412" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Opt-Out Compliance Filters</text>
    <text x="90" y="442" font-family="monospace" font-size="11" fill="#34d399">http://127.0.0.1:8090</text>
  </g>

  <!-- Arrow to SQLite -->
  <path d="M 330 380 L 410 380" stroke="#10b981" stroke-width="2.5" fill="none"/>
  <text x="370" y="370" font-family="sans-serif" font-size="10" fill="#10b981" font-weight="bold" text-anchor="middle">ACID</text>

  <!-- Node 3: SQLite Database -->
  <g filter="url(#archShadow)">
    <rect x="410" y="320" width="260" height="145" rx="10" fill="#1e293b" stroke="#334155"/>
    <rect x="410" y="320" width="260" height="32" rx="10" fill="#7c3aed"/>
    <text x="540" y="342" font-family="sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">Local SQLite Database</text>
    <text x="430" y="372" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Foreign Key PRAGMA Enforced</text>
    <text x="430" y="392" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Automatic Schema Migrations</text>
    <text x="430" y="412" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Full Atomic JSON Backup/Restore</text>
    <text x="430" y="442" font-family="monospace" font-size="11" fill="#a78bfa">whatsapp_campaign.db</text>
  </g>

  <!-- Node 4: Baileys WhatsApp Gateway -->
  <g filter="url(#archShadow)">
    <rect x="410" y="130" width="260" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
    <rect x="410" y="130" width="260" height="32" rx="10" fill="#0284c7"/>
    <text x="540" y="152" font-family="sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">Node.js Baileys Gateway</text>
    <text x="430" y="182" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Multi-Device Protocol Sync</text>
    <text x="430" y="202" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Anti-Ban Jitter Rate Pacing</text>
    <text x="430" y="222" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Webhook: X-Gateway-Secret</text>
    <text x="430" y="252" font-family="monospace" font-size="11" fill="#38bdf8">http://127.0.0.1:3050</text>
  </g>

  <!-- Connect Gateway to Backend -->
  <path d="M 540 280 L 540 320" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3" fill="none"/>
  <text x="545" y="303" font-family="sans-serif" font-size="10" fill="#f59e0b" font-weight="600">Secure Webhook</text>

  <!-- Arrow from Local Gateway out to WhatsApp Servers -->
  <path d="M 670 190 L 780 190" stroke="#10b981" stroke-width="3" fill="none"/>
  <text x="725" y="180" font-family="sans-serif" font-size="11" fill="#10b981" font-weight="bold" text-anchor="middle">E2E Encrypted</text>
  <text x="725" y="210" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">WebSocket (WSS)</text>

  <!-- External Node: WhatsApp Multi-Device Network -->
  <g filter="url(#archShadow)">
    <rect x="780" y="115" width="280" height="180" rx="12" fill="#111827" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="780" y="115" width="280" height="34" rx="12" fill="#15803d"/>
    <text x="920" y="137" font-family="sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">Official WhatsApp Network</text>
    <text x="800" y="175" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Linked Session (QR Code)</text>
    <text x="800" y="198" font-family="sans-serif" font-size="12" fill="#e2e8f0">• End-to-End Encryption (E2EE)</text>
    <text x="800" y="221" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Standard Multi-Device Pairing</text>
    <text x="800" y="244" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Zero Cloud Intermediary</text>
    <text x="800" y="275" font-family="sans-serif" font-size="11" fill="#22c55e" font-weight="bold">Delivers directly to Customers</text>
  </g>

  <!-- External Node 2: Alternative Manual Click-to-Chat Mode -->
  <g filter="url(#archShadow)">
    <rect x="780" y="330" width="280" height="135" rx="12" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="780" y="330" width="280" height="34" rx="12" fill="#1d4ed8"/>
    <text x="920" y="352" font-family="sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">Alternative: Click-to-Chat</text>
    <text x="800" y="388" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Official URL: wa.me/&lt;number&gt;</text>
    <text x="800" y="410" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Opens Native WhatsApp / Web</text>
    <text x="800" y="432" font-family="sans-serif" font-size="12" fill="#e2e8f0">• 100% Zero-Risk Compliance</text>
  </g>

  <path d="M 330 200 C 370 200, 720 280, 780 370" stroke="#3b82f6" stroke-dasharray="4,4" stroke-width="2" fill="none"/>
</svg>

