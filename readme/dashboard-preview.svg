  <!-- Logo -->
  <rect x="36" y="78" width="32" height="32" rx="8" fill="#10b981"/>
  <path d="M46 94 C46 88 58 88 58 94 C58 98 54 100 52 102 L48 102" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="78" y="94" font-family="sans-serif" font-size="15" fill="#f8fafc" font-weight="bold">WhatsApp</text>
  <text x="78" y="107" font-family="sans-serif" font-size="11" fill="#10b981" font-weight="600">Campaign Manager</text>

  <!-- Nav links -->
