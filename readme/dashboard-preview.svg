  <text x="50" y="153" font-family="sans-serif" font-size="13" fill="#34d399" font-weight="600">📊 Overview</text>
  <text x="50" y="195" font-family="sans-serif" font-size="13" fill="#94a3b8">👥 Contacts (CRM)</text>
  <text x="50" y="235" font-family="sans-serif" font-size="13" fill="#94a3b8">🚀 Campaigns</text>
  <text x="50" y="275" font-family="sans-serif" font-size="13" fill="#94a3b8">💬 2-Way Inbox</text>
  <text x="50" y="315" font-family="sans-serif" font-size="13" fill="#94a3b8">📝 Templates</text>
  <text x="50" y="355" font-family="sans-serif" font-size="13" fill="#94a3b8">⚙️ Gateway Config</text>
  <text x="50" y="395" font-family="sans-serif" font-size="13" fill="#94a3b8">🛡️ Compliance Guide</text>

