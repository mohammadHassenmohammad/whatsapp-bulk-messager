  <circle cx="24" cy="22" r="6" fill="#ef4444"/>
  <circle cx="44" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="22" r="6" fill="#10b981"/>
  <text x="600" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="500">WhatsApp Campaign Manager • Overview &amp; Analytics Hub (100% Local-First)</text>
  <rect x="1050" y="12" width="125" height="22" rx="11" fill="#1e293b" stroke="#334155"/>
  <circle cx="1063" cy="23" r="4" fill="#10b981"/>
  <text x="1075" y="27" font-family="sans-serif" font-size="11" fill="#10b981" font-weight="600">Gateway: Active</text>

  <!-- Navigation / Sidebar Mock -->
