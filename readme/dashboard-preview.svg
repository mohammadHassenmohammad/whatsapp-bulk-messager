  <text x="42" y="607" font-family="sans-serif" font-size="11" fill="#38bdf8" font-weight="bold">🔒 100% PRIVATE &amp; LOCAL</text>
  <text x="42" y="623" font-family="sans-serif" font-size="10" fill="#94a3b8">SQLite + Local Gateway</text>
  <text x="42" y="636" font-family="sans-serif" font-size="10" fill="#64748b">Zero Cloud Subscriptions</text>

  <!-- Main Content Area -->
  <!-- Header Bar -->
  <text x="245" y="90" font-family="sans-serif" font-size="22" fill="#f8fafc" font-weight="bold">Campaign Intelligence Dashboard</text>
  <text x="245" y="110" font-family="sans-serif" font-size="12" fill="#94a3b8">Live metrics across customer audiences, active queues, delivery rates and inbound replies.</text>

  <!-- Date Range Filter -->
  <rect x="1010" y="75" width="170" height="32" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="1030" y="96" font-family="sans-serif" font-size="12" fill="#cbd5e1">📅 Last 30 Days ▾</text>

  <!-- 4 Stat Cards -->
  <!-- Card 1: Total Contacts -->
  <g filter="url(#cardShadow)">
    <rect x="245" y="130" width="220" height="95" rx="10" fill="#1e293b" stroke="#334155"/>
    <rect x="255" y="142" width="36" height="36" rx="8" fill="#3b82f6" fill-opacity="0.2"/>
