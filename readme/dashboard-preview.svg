    <text x="1100" y="527" font-family="sans-serif" font-size="12" fill="#10b981" font-weight="600">+ New Campaign</text>

    <!-- Table Header -->
    <line x1="265" y1="540" x2="1160" y2="540" stroke="#334155"/>
    <text x="265" y="556" font-family="sans-serif" font-size="11" fill="#94a3b8" font-weight="600">CAMPAIGN NAME</text>
    <text x="500" y="556" font-family="sans-serif" font-size="11" fill="#94a3b8" font-weight="600">MODE</text>
    <text x="640" y="556" font-family="sans-serif" font-size="11" fill="#94a3b8" font-weight="600">RECIPIENTS</text>
    <text x="790" y="556" font-family="sans-serif" font-size="11" fill="#94a3b8" font-weight="600">PACE DELAY</text>
    <text x="940" y="556" font-family="sans-serif" font-size="11" fill="#94a3b8" font-weight="600">STATUS</text>
    <text x="1080" y="556" font-family="sans-serif" font-size="11" fill="#94a3b8" font-weight="600">SUCCESS</text>

    <!-- Row 1 -->
    <text x="265" y="582" font-family="sans-serif" font-size="12" fill="#f8fafc" font-weight="500">Q4 VIP Customer Early Access Promo</text>
    <text x="500" y="582" font-family="sans-serif" font-size="11" fill="#38bdf8">Baileys Gateway</text>
    <text x="640" y="582" font-family="sans-serif" font-size="12" fill="#cbd5e1">250 contacts</text>
    <text x="790" y="582" font-family="sans-serif" font-size="12" fill="#cbd5e1">5 - 12 sec</text>
    <rect x="940" y="570" width="70" height="18" rx="9" fill="#065f46"/>
    <text x="954" y="583" font-family="sans-serif" font-size="10" fill="#34d399" font-weight="bold">ACTIVE</text>
    <text x="1080" y="582" font-family="sans-serif" font-size="12" fill="#34d399" font-weight="bold">98.8%</text>

    <!-- Row 2 -->
    <text x="265" y="618" font-family="sans-serif" font-size="12" fill="#f8fafc" font-weight="500">Product Webinar RSVP &amp; Zoom Reminder</text>
    <text x="500" y="618" font-family="sans-serif" font-size="11" fill="#34d399">Click-to-Chat</text>
    <text x="640" y="618" font-family="sans-serif" font-size="12" fill="#cbd5e1">94 contacts</text>
    <text x="790" y="618" font-family="sans-serif" font-size="12" fill="#cbd5e1">Manual Click</text>
    <rect x="940" y="606" width="85" height="18" rx="9" fill="#1e3a8a"/>
    <text x="950" y="619" font-family="sans-serif" font-size="10" fill="#60a5fa" font-weight="bold">COMPLETED</text>
    <text x="1080" y="618" font-family="sans-serif" font-size="12" fill="#34d399" font-weight="bold">100%</text>
