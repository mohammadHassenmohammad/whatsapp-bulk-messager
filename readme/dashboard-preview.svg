    <text x="840" y="365" font-family="sans-serif" font-size="11" fill="#cbd5e1">2. Contacted (380)</text>
    <rect x="840" y="373" width="225" height="14" rx="4" fill="#06b6d4"/>

    <text x="840" y="405" font-family="sans-serif" font-size="11" fill="#cbd5e1">3. Qualified / Engaged (260)</text>
    <rect x="840" y="413" width="154" height="14" rx="4" fill="#10b981"/>

    <text x="840" y="445" font-family="sans-serif" font-size="11" fill="#cbd5e1">4. Proposal Sent &amp; Won (180)</text>
    <rect x="840" y="453" width="106" height="14" rx="4" fill="#8b5cf6"/>
