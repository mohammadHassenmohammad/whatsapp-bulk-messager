    <text x="270" y="468" font-family="sans-serif" font-size="11" fill="#64748b">Week 1</text>
    <text x="395" y="468" font-family="sans-serif" font-size="11" fill="#64748b">Week 2</text>
    <text x="520" y="468" font-family="sans-serif" font-size="11" fill="#64748b">Week 3</text>
    <text x="645" y="468" font-family="sans-serif" font-size="11" fill="#64748b">Week 4</text>
    <text x="760" y="468" font-family="sans-serif" font-size="11" fill="#64748b">Today</text>
