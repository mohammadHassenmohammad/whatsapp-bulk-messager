    <path d="M 270 430 Q 350 350 430 380 T 590 320 T 770 290" fill="none" stroke="#10b981" stroke-width="3"/>
    
    <!-- Replies Line -->
    <path d="M 270 445 Q 350 420 430 410 T 590 380 T 770 355" fill="none" stroke="#3b82f6" stroke-width="2.5"/>

