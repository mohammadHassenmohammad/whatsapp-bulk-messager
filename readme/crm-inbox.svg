<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" rx="16" fill="url(#bgGrad3)" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Window Bar -->
  <rect x="0" y="0" width="1200" height="44" rx="16" fill="#090d16"/>
  <rect x="0" y="30" width="1200" height="14" fill="#090d16"/>
  <circle cx="24" cy="22" r="6" fill="#ef4444"/>
  <circle cx="44" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="22" r="6" fill="#10b981"/>
  <text x="600" y="27" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="500">WhatsApp Campaign Manager • Real-Time 2-Way CRM Inbox</text>

  <!-- Container for Inbox (3 Columns) -->
  <!-- Col 1: Conversation List (320px) -->
  <g filter="url(#shadow3)">
    <rect x="25" y="60" width="310" height="595" rx="12" fill="#1e293b" stroke="#334155"/>
    
    <!-- Inbox Header & Search -->
    <text x="45" y="92" font-family="sans-serif" font-size="16" fill="#f8fafc" font-weight="bold">Inbox &amp; Replies</text>
    <rect x="270" y="78" width="50" height="20" rx="10" fill="#10b981" fill-opacity="0.2"/>
    <text x="295" y="92" font-family="sans-serif" font-size="11" fill="#34d399" font-weight="bold" text-anchor="middle">LIVE</text>

    <!-- Filter chips -->
    <rect x="45" y="112" width="55" height="24" rx="12" fill="#10b981"/>
    <text x="72" y="128" font-family="sans-serif" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">All (14)</text>
    <rect x="108" y="112" width="70" height="24" rx="12" fill="#334155"/>
    <text x="143" y="128" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Unread (3)</text>
    <rect x="186" y="112" width="70" height="24" rx="12" fill="#334155"/>
    <text x="221" y="128" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Hot Leads</text>

    <!-- Chat Item 1 (Selected) -->
    <rect x="35" y="150" width="290" height="85" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="65" cy="192" r="18" fill="#10b981"/>
    <text x="65" y="197" font-family="sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">MR</text>
    <text x="95" y="180" font-family="sans-serif" font-size="13" fill="#f8fafc" font-weight="bold">Michael Roberts</text>
    <text x="280" y="180" font-family="sans-serif" font-size="10" fill="#10b981" font-weight="600">10:48 AM</text>
    <text x="95" y="200" font-family="sans-serif" font-size="11" fill="#cbd5e1">Can we schedule a 15 min demo?</text>
    <rect x="95" y="210" width="70" height="16" rx="4" fill="#3b82f6" fill-opacity="0.3"/>
    <text x="130" y="222" font-family="sans-serif" font-size="9" fill="#60a5fa" font-weight="bold" text-anchor="middle">QUALIFIED</text>
    <rect x="172" y="210" width="60" height="16" rx="4" fill="#10b981" fill-opacity="0.3"/>
    <text x="202" y="222" font-family="sans-serif" font-size="9" fill="#34d399" font-weight="bold" text-anchor="middle">DEMO REQ</text>

    <!-- Chat Item 2 -->
    <rect x="35" y="245" width="290" height="80" rx="10" fill="#1e293b"/>
    <line x1="35" y1="245" x2="325" y2="245" stroke="#334155"/>
    <circle cx="65" cy="285" r="18" fill="#6366f1"/>
    <text x="65" y="290" font-family="sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">SJ</text>
    <text x="95" y="273" font-family="sans-serif" font-size="13" fill="#f8fafc" font-weight="600">Sarah Jenkins</text>
    <text x="280" y="273" font-family="sans-serif" font-size="10" fill="#94a3b8">09:30 AM</text>
    <text x="95" y="293" font-family="sans-serif" font-size="11" fill="#94a3b8">Can I apply voucher to annual sub?</text>
    <rect x="95" y="303" width="75" height="16" rx="4" fill="#8b5cf6" fill-opacity="0.3"/>
    <text x="132" y="315" font-family="sans-serif" font-size="9" fill="#c084fc" font-weight="bold" text-anchor="middle">PROPOSAL</text>

    <!-- Chat Item 3 -->
    <rect x="35" y="335" width="290" height="80" rx="10" fill="#1e293b"/>
    <line x1="35" y1="335" x2="325" y2="335" stroke="#334155"/>
    <circle cx="65" cy="375" r="18" fill="#f59e0b"/>
    <text x="65" y="380" font-family="sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">DK</text>
    <text x="95" y="363" font-family="sans-serif" font-size="13" fill="#f8fafc" font-weight="600">David Kumar</text>
    <text x="285" y="363" font-family="sans-serif" font-size="10" fill="#94a3b8">Yesterday</text>
    <text x="95" y="383" font-family="sans-serif" font-size="11" fill="#94a3b8">Order received in perfect shape!</text>
    <rect x="95" y="393" width="70" height="16" rx="4" fill="#10b981" fill-opacity="0.3"/>
    <text x="130" y="405" font-family="sans-serif" font-size="9" fill="#34d399" font-weight="bold" text-anchor="middle">CUSTOMER</text>
  </g>

  <!-- Col 2: Chat Viewport (520px) -->
  <g filter="url(#shadow3)">
    <rect x="350" y="60" width="510" height="595" rx="12" fill="#1e293b" stroke="#334155"/>
    
    <!-- Active Chat Header -->
    <rect x="350" y="60" width="510" height="60" rx="12" fill="#0f172a"/>
    <circle cx="385" cy="90" r="18" fill="#10b981"/>
    <text x="385" y="95" font-family="sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">MR</text>
    <text x="415" y="85" font-family="sans-serif" font-size="14" fill="#f8fafc" font-weight="bold">Michael Roberts (Apex Solutions)</text>
    <text x="415" y="103" font-family="sans-serif" font-size="11" fill="#94a3b8">+1 (555) 234-5678 • WhatsApp Synced</text>

    <!-- Quick Action in header -->
    <rect x="740" y="78" width="105" height="26" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6"/>
    <text x="792" y="95" font-family="sans-serif" font-size="11" fill="#60a5fa" font-weight="bold" text-anchor="middle">+ Add Task</text>

    <!-- Message Bubble Outgoing (Campaign) -->
    <rect x="520" y="145" width="325" height="85" rx="10" fill="#005c4b"/>
    <text x="535" y="170" font-family="sans-serif" font-size="12" fill="#e9edef">Hi Michael! Here is the latest Q4</text>
    <text x="535" y="190" font-family="sans-serif" font-size="12" fill="#e9edef">product release you requested earlier.</text>
    <text x="535" y="210" font-family="sans-serif" font-size="10" fill="#8696a0">Sent via Q4 Product Campaign • 10:30 AM  ✓✓</text>

    <!-- Message Bubble Incoming -->
    <rect x="365" y="245" width="330" height="95" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="380" y="270" font-family="sans-serif" font-size="12" fill="#e9edef">Thanks for this! This looks great.</text>
    <text x="380" y="290" font-family="sans-serif" font-size="12" fill="#e9edef">Can we schedule a 15 min demo for our</text>
    <text x="380" y="310" font-family="sans-serif" font-size="12" fill="#e9edef">engineering team this Thursday?</text>
    <text x="640" y="328" font-family="sans-serif" font-size="10" fill="#8696a0">10:48 AM</text>

    <!-- Intent Classification Badge -->
    <rect x="380" y="350" width="220" height="22" rx="6" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-dasharray="3,3"/>
    <text x="490" y="365" font-family="sans-serif" font-size="10" fill="#60a5fa" font-weight="600" text-anchor="middle">🎯 Deterministic Intent: Demo Booking</text>

    <!-- Outgoing Reply Bubble -->
    <rect x="520" y="390" width="325" height="75" rx="10" fill="#005c4b"/>
    <text x="535" y="415" font-family="sans-serif" font-size="12" fill="#e9edef">Absolutely Michael! Thursday at 2 PM</text>
    <text x="535" y="435" font-family="sans-serif" font-size="12" fill="#e9edef">works. I'll send the calendar invite now.</text>
    <text x="770" y="455" font-family="sans-serif" font-size="10" fill="#8696a0">10:50 AM  ✓✓</text>

    <!-- Bottom Input Bar -->
    <rect x="365" y="585" width="415" height="48" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="385" y="614" font-family="sans-serif" font-size="12" fill="#64748b">Type a direct WhatsApp reply...</text>
    <rect x="790" y="585" width="55" height="48" rx="8" fill="#10b981"/>
    <text x="817" y="615" font-family="sans-serif" font-size="14" fill="#fff" text-anchor="middle">➤</text>
  </g>

  <!-- Col 3: Customer Detail Drawer (290px) -->
  <g filter="url(#shadow3)">
    <rect x="875" y="60" width="300" height="595" rx="12" fill="#1e293b" stroke="#334155"/>
    
    <text x="895" y="92" font-family="sans-serif" font-size="15" fill="#f8fafc" font-weight="bold">Customer Profile</text>
    <line x1="895" y1="108" x2="1155" y2="108" stroke="#334155"/>

    <!-- Avatar & Info -->
    <circle cx="1025" cy="155" r="30" fill="#10b981"/>
    <text x="1025" y="163" font-family="sans-serif" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle">MR</text>
    <text x="1025" y="205" font-family="sans-serif" font-size="15" fill="#f8fafc" font-weight="bold" text-anchor="middle">Michael Roberts</text>
    <text x="1025" y="223" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">VP of Operations, Apex Solutions</text>

    <!-- Stage Selector -->
    <text x="895" y="260" font-family="sans-serif" font-size="11" fill="#cbd5e1" font-weight="600">LEAD STAGE</text>
    <rect x="895" y="270" width="260" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="910" y="292" font-family="sans-serif" font-size="12" fill="#60a5fa" font-weight="bold">🌟 Qualified Lead ▾</text>

    <!-- Phone & Consent -->
    <text x="895" y="330" font-family="sans-serif" font-size="11" fill="#cbd5e1" font-weight="600">PHONE NUMBER</text>
    <text x="895" y="348" font-family="monospace" font-size="12" fill="#f8fafc">+1 (555) 234-5678</text>

    <text x="895" y="380" font-family="sans-serif" font-size="11" fill="#cbd5e1" font-weight="600">CONSENT STATUS</text>
    <rect x="895" y="390" width="95" height="22" rx="11" fill="#065f46"/>
    <text x="942" y="405" font-family="sans-serif" font-size="10" fill="#34d399" font-weight="bold" text-anchor="middle">SUBSCRIBED</text>

    <!-- Tasks -->
    <text x="895" y="445" font-family="sans-serif" font-size="11" fill="#cbd5e1" font-weight="600">UPCOMING TASKS</text>
    <rect x="895" y="455" width="260" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="910" y="478" font-family="sans-serif" font-size="12" fill="#f8fafc" font-weight="bold">Deliver 15-min demo</text>
    <text x="910" y="496" font-family="sans-serif" font-size="11" fill="#f59e0b">Due: Thursday 2:00 PM</text>
    <text x="910" y="512" font-family="sans-serif" font-size="10" fill="#94a3b8">Assigned: Primary Account</text>
  </g>
</svg>
